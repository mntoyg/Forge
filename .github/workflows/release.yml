name: Release

# Releases are cut by pushing an annotated tag; see .forge/workflows/release.md.
# Build once, then publish the same distributions to GitHub Releases and PyPI.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
      # Pinned to an exact tag, unlike checkout above. astral-sh publishes no
      # moving major alias past v7, and v7 is three majors behind - so a
      # floating ref here would be a pin without saying so. v6 and earlier
      # still declare node20, which is the thing this is getting away from.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups --locked

      # A tag must never ship something that would fail CI.
      - name: Re-run the quality gate
        run: |
          uv run black --check .
          uv run ruff check .
          uv run mypy
          uv run pytest

      - name: Build the distribution
        run: uv build

      - name: Upload release distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Create a GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mntoyg-forge/
    permissions:
      id-token: write

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
